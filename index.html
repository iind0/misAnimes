<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis animes</title>
<style>
:root{--bg:#edf1f6;--card:#fff;--tx:#10202e;--mu:#5b6b7a;--ac:#0f766e;--acx:#fff;--bd:#d5dde6;--in:#f6f9fc}
:root[data-t=dark]{--bg:#0d1821;--card:#15242f;--tx:#e6eef5;--mu:#8ea1b1;--ac:#5eead4;--acx:#07211d;--bd:#26394a;--in:#0f1c26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:0 16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:24px}
h1{font:700 2rem/1.1 Georgia,"Times New Roman",serif;margin:0}
.sub{color:var(--mu);margin:4px 0 0;font-size:.9rem}
button,select,input{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
.bar input,.bar select{background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
.bar input[type=search]{flex:1 1 200px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
#cnt{color:var(--mu);font-size:.9rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding-bottom:40px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cv{aspect-ratio:2/3;background:var(--in);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--mu);font:700 1rem Georgia,serif;overflow:hidden}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.b{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.b h3{margin:0;font-size:.95rem;line-height:1.25}
.m{margin:0;color:var(--mu);font-size:.8rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.st{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.st.Visto{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.st.Viendo{border-color:var(--ac);color:var(--ac)}
.sc{font-weight:700;font-size:.9rem}
.sc.n{color:var(--mu);font-weight:400;font-size:.8rem}
.b button{padding:5px 8px;font-size:.8rem;width:100%;margin-top:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 12px;font:700 1.3rem Georgia,serif}
label{display:block;font-size:.85rem;color:var(--mu);margin-top:10px}
dialog input,dialog select{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.acts .d{margin-right:auto;color:#c0392b}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Mis animes</h1>
    <p class="sub">Lo que he visto, lo que estoy viendo y lo que me falta.</p>
  </div>
  <div class="tools">
    <button id="theme" type="button">Modo oscuro</button>
    <button id="exp" type="button">Exportar</button>
    <button id="imp" type="button">Importar</button>
    <button id="cov" type="button">Buscar portadas</button>
    <button id="add" type="button" class="p">Agregar anime</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</header>
<main>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar por título" aria-label="Buscar por título">
    <select id="fg" aria-label="Filtrar por género"></select>
    <select id="fs" aria-label="Filtrar por estado">
      <option value="">Todos los estados</option>
      <option>Visto</option><option>Viendo</option><option>Pendiente</option>
    </select>
  </div>
  <p id="cnt"></p>
  <p id="msg" class="sub" role="status"></p>
  <div id="grid" class="grid"></div>
</main>

<dialog id="dlg">
  <form id="f">
    <h2 id="dt">Agregar anime</h2>
    <label>Título<input id="t" required></label>
    <div class="two">
      <label>Género<input id="g" list="gl" required></label>
      <label>Estado<select id="s"><option>Visto</option><option>Viendo</option><option>Pendiente</option></select></label>
    </div>
    <div class="two">
      <label>Episodios<input id="e" type="number" min="0" step="1"></label>
      <label>Puntaje (0 a 10)<input id="p" type="number" min="0" max="10" step="0.5"></label>
    </div>
    <label>Link de la portada<input id="u" type="url" placeholder="https://..."></label>
    <datalist id="gl"></datalist>
    <div class="acts">
      <button type="button" class="d" id="del">Eliminar</button>
      <button type="button" id="cx">Cancelar</button>
      <button type="submit" class="p">Guardar</button>
    </div>
  </form>
</dialog>

<script>
var KEY='mis-animes-v1', TKEY='mis-animes-tema';
function seed(){
  var vistos=['Mushoku Tensei: Jobless Reincarnation','Re:Zero - Starting Life in Another World','The Eminence in Shadow','KonoSuba!','Solo Leveling','Ascendance of a Bookworm','Overlord','That Time I Got Reincarnated as a Slime','No Game No Life','Shangri-La Frontier','Youjo Senki: Saga of Tanya the Evil','Uncle from Another World','Grimgar, Fantasy and Ash','Drifters','The Executioner and Her Way of Life','Cautious Hero','Tsukimichi: Moonlit Fantasy','Re:Creators',"The World's Finest Assassin Gets Reincarnated in Another World as an Aristocrat",'Gate: Thus the JSDF Fought There!','The Faraway Paladin','Kemono Michi: Rise Up','The 8th Son? Are You Kidding Me?','By the Grace of the Gods','Skeleton Knight in Another World'];
  var pend=['Escaflowne','Fushigi Yuugi','Inuyasha','The Twelve Kingdoms','Magic Knight Rayearth','The Familiar of Zero'];
  var l=[],i=0;
  vistos.forEach(function(t){l.push({id:'s'+(i++),t:t,g:'Isekai',s:'Visto',e:'',p:'',u:''})});
  l.push({id:'s'+(i++),t:"Banished from the Hero's Party",g:'Fantasía',s:'Visto',e:'',p:'',u:''});
  l.push({id:'s'+(i++),t:'Vivy: Fluorite Eye\'s Song',g:'Ciencia ficción',s:'Visto',e:'',p:'',u:''});
  pend.forEach(function(t){l.push({id:'s'+(i++),t:t,g:'Isekai',s:'Pendiente',e:'',p:'',u:''})});
  return l;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var a=JSON.parse(r);if(Array.isArray(a))return a}}catch(x){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(x){}}
var items=load(), editId=null;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function genres(){
  var set={};items.forEach(function(a){set[a.g]=1});
  return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'es')});
}
function fillGenres(){
  var cur=$('fg').value, gs=genres();
  $('fg').innerHTML='<option value="">Todos los géneros</option>'+gs.map(function(g){return '<option>'+esc(g)+'</option>'}).join('');
  $('fg').value=gs.indexOf(cur)>-1?cur:'';
  $('gl').innerHTML=gs.map(function(g){return '<option value="'+esc(g)+'">'}).join('');
}
function render(){
  var q=$('q').value.trim().toLowerCase(), fg=$('fg').value, fs=$('fs').value;
  var list=items.filter(function(a){
    return (!q||a.t.toLowerCase().indexOf(q)>-1)&&(!fg||a.g===fg)&&(!fs||a.s===fs);
  });
  $('cnt').textContent=list.length+' de '+items.length+' animes';
  $('grid').innerHTML=list.length?list.map(function(a){
    var img=a.u?'<img src="'+esc(a.u)+'" alt="Portada de '+esc(a.t)+'" loading="lazy" referrerpolicy="no-referrer">':esc(a.t);
    var meta=esc(a.g)+(a.e!==''&&a.e!=null?' · '+esc(a.e)+' episodios':'');
    var sc=(a.p!==''&&a.p!=null)?'<span class="sc">★ '+esc(a.p)+'/10</span>':'<span class="sc n">Sin puntaje</span>';
    return '<article class="c"><div class="cv">'+img+'</div><div class="b"><h3>'+esc(a.t)+'</h3><p class="m">'+meta+'</p><div class="row"><span class="st '+esc(a.s)+'">'+esc(a.s)+'</span>'+sc+'</div><button type="button" data-id="'+esc(a.id)+'">Editar</button></div></article>';
  }).join(''):'<p class="empty">No hay animes con esos filtros. Cambia la búsqueda o agrega uno nuevo.</p>';
  Array.prototype.forEach.call(document.querySelectorAll('.cv img'),function(im){
    im.onerror=function(){var d=im.parentNode;d.textContent=im.alt.replace('Portada de ','')};
  });
}
function openDlg(id){
  editId=id;
  var a=items.filter(function(x){return x.id===id})[0]||{t:'',g:'',s:'Pendiente',e:'',p:'',u:''};
  $('dt').textContent=id?'Editar anime':'Agregar anime';
  $('t').value=a.t;$('g').value=a.g;$('s').value=a.s;$('e').value=a.e;$('p').value=a.p;$('u').value=a.u;
  $('del').style.display=id?'':'none';
  $('dlg').showModal();$('t').focus();
}
$('add').onclick=function(){openDlg(null)};
$('cx').onclick=function(){$('dlg').close()};
$('grid').onclick=function(ev){var b=ev.target.closest('button[data-id]');if(b)openDlg(b.getAttribute('data-id'))};
$('f').onsubmit=function(ev){
  ev.preventDefault();
  var o={t:$('t').value.trim(),g:$('g').value.trim(),s:$('s').value,e:$('e').value,p:$('p').value,u:$('u').value.trim()};
  if(editId){items=items.map(function(a){return a.id===editId?Object.assign({},a,o):a})}
  else{o.id='n'+Date.now();items.unshift(o)}
  save();fillGenres();render();$('dlg').close();
};
$('del').onclick=function(){
  if(confirm('¿Eliminar este anime de la lista?')){items=items.filter(function(a){return a.id!==editId});save();fillGenres();render();$('dlg').close()}
};
['q','fg','fs'].forEach(function(id){$(id).oninput=render});

function setTheme(t){
  document.documentElement.setAttribute('data-t',t);
  $('theme').textContent=t==='dark'?'Modo claro':'Modo oscuro';
  try{localStorage.setItem(TKEY,t)}catch(x){}
}
$('theme').onclick=function(){setTheme(document.documentElement.getAttribute('data-t')==='dark'?'light':'dark')};
(function(){
  var t=null;try{t=localStorage.getItem(TKEY)}catch(x){}
  if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  setTheme(t);
})();

$('exp').onclick=function(){
  var blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-animes.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
};
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var a=JSON.parse(r.result);
      if(!Array.isArray(a)||a.some(function(x){return !x||!x.t}))throw 0;
      items=a.map(function(x,i){return {id:x.id||('i'+i+Date.now()),t:String(x.t),g:x.g||'Sin género',s:x.s||'Pendiente',e:x.e==null?'':x.e,p:x.p==null?'':x.p,u:x.u||''}});
      save();fillGenres();render();
    }catch(x){alert('No pude leer ese archivo. Usa uno exportado desde esta página.')}
  };
  r.readAsText(f);this.value='';
};

var busy=false;
function pausa(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function buscarUno(a){
  var q=a.t.replace(/\(.*?\)/g,'').trim();
  for(var n=0;n<3;n++){
    var r=await fetch('https://api.jikan.moe/v4/anime?limit=1&q='+encodeURIComponent(q));
    if(r.status===429){await pausa(2500);continue}
    if(!r.ok)return null;
    var j=await r.json();
    return j.data&&j.data[0]?j.data[0]:null;
  }
  return null;
}
$('cov').onclick=async function(){
  if(busy)return;
  var falta=items.filter(function(a){return !a.u||a.e===''});
  if(!falta.length){$('msg').textContent='Todos los animes ya tienen portada y episodios.';return}
  busy=true;$('cov').disabled=true;
  var ok=0;
  try{
    for(var i=0;i<falta.length;i++){
      $('msg').textContent='Buscando '+(i+1)+' de '+falta.length+': '+falta[i].t;
      var d=await buscarUno(falta[i]);
      if(d){
        var img=d.images&&d.images.jpg&&d.images.jpg.image_url;
        if(!falta[i].u&&img)falta[i].u=img;
        if(falta[i].e===''&&d.episodes)falta[i].e=d.episodes;
        ok++;save();render();
      }
      await pausa(1100);
    }
    $('msg').textContent='Listo: encontré datos para '+ok+' de '+falta.length+'. Si alguna portada quedó mal, corrígela con Editar.';
  }catch(x){$('msg').textContent='No pude conectarme a la base de datos. Revisa tu internet e intenta de nuevo.'}
  busy=false;$('cov').disabled=false;
};

fillGenres();render();
</script>
</body>
</html>
