<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis animes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#edf1f6;--card:#fff;--tx:#10202e;--mu:#5b6b7a;--ac:#0f766e;--acx:#fff;--bd:#d5dde6;--in:#f6f9fc}
:root[data-t=dark]{--bg:#0d1821;--card:#15242f;--tx:#e6eef5;--mu:#8ea1b1;--ac:#5eead4;--acx:#07211d;--bd:#26394a;--in:#0f1c26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:0 16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:24px}
h1{font:700 2rem/1.1 Georgia,"Times New Roman",serif;margin:0}
.sub{color:var(--mu);margin:4px 0 0;font-size:.9rem}
button,select,input{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
.bar input,.bar select{background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
.bar input[type=search]{flex:1 1 200px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
#cnt{color:var(--mu);font-size:.9rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding-bottom:40px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cv{aspect-ratio:2/3;background:var(--in);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--mu);font:700 1rem Georgia,serif;overflow:hidden}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.b{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.b h3{margin:0;font-size:.95rem;line-height:1.25}
.m{margin:0;color:var(--mu);font-size:.8rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.st{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.st.Visto{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.st.Viendo{border-color:var(--ac);color:var(--ac)}
.sc{font-weight:700;font-size:.9rem}
.sc.n{color:var(--mu);font-weight:400;font-size:.8rem}
.b button{padding:5px 8px;font-size:.8rem;width:100%;margin-top:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 12px;font:700 1.3rem Georgia,serif}
label{display:block;font-size:.85rem;color:var(--mu);margin-top:10px}
dialog input,dialog select{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.acts .d{margin-right:auto;color:#c0392b}

.rs{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.rs img,.rs .ph{width:44px;height:64px;object-fit:cover;border-radius:6px;background:var(--in);flex:none}
.rs .i{flex:1;min-width:0}
.rs .i b{display:block;font-size:.9rem;line-height:1.25}
.rs .i span{color:var(--mu);font-size:.8rem}
.rs button{padding:5px 10px;font-size:.8rem}
#rl{max-height:50vh;overflow:auto;margin-top:10px}
details.fl{margin-top:10px}
details.fl summary{cursor:pointer;color:var(--mu);font-size:.85rem}
.sr{display:flex;gap:8px}
.ck{display:flex;align-items:center;gap:8px}
.ck input{width:auto!important;margin:0!important}
.sr input{flex:1}
.cv a{display:block;width:100%;height:100%;color:inherit;text-decoration:none;cursor:pointer}
.w{display:flex;flex-wrap:wrap;gap:4px;margin:0}
.w span{font-size:.7rem;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.w a{font-size:.7rem;padding:1px 7px;border-radius:99px;text-decoration:none}
.w .b2{font-weight:600}
.w .cr{background:#c2410c;color:#fff;border-color:#c2410c;font-weight:600}
.w.n{font-size:.7rem;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
body.disc .cv.ad img{filter:blur(22px)}
.opt{position:relative}
.opt summary{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 14px;list-style:none}
.opt .pn{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;z-index:20;min-width:240px}
.opt label{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--tx);font-size:.9rem}
.opt input{width:auto}
#stats{color:var(--mu);font-size:.85rem;margin:0 0 4px}
.mcl{max-height:180px;overflow:auto;margin-top:8px;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Mis animes</h1>
    <p class="sub">Lo que he visto, lo que estoy viendo y lo que me falta.</p>
  </div>
  <div class="tools">
    <button id="theme" type="button">Modo oscuro</button>
    <button id="exp" type="button">Exportar</button>
    <button id="imp" type="button">Importar</button>
    <button id="cov" type="button">Buscar portadas</button>
    <button id="sb" type="button">Buscar anime</button>
    <button id="login" type="button">Iniciar sesión con Google</button>
    <button id="fbk" type="button">Enlace de respaldo</button>
    <details class="opt"><summary>Opciones</summary><div class="pn"><label><input type="checkbox" id="odisc"> Modo discreto (difuminar +18)</label><label><input type="checkbox" id="onof"> Mostrar sitios no oficiales</label></div></details>
    <button id="add" type="button" class="p">Agregar anime</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</header>
<main>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar por título" aria-label="Buscar por título">
    <select id="fg" aria-label="Filtrar por género"></select>
    <select id="fs" aria-label="Filtrar por estado">
      <option value="">Todos los estados</option>
      <option>Visto</option><option>Viendo</option><option>Pendiente</option>
    </select>
    <select id="ord" aria-label="Ordenar"><option value="">Más recientes</option><option value="p">Mejor puntaje</option><option value="t">Título A-Z</option></select>
  </div>
  <p id="stats"></p>
  <p id="cnt"></p>
  <p id="msg" class="sub" role="status"></p>
  <div id="grid" class="grid"></div>
</main>

<div id="toast" class="toast" role="status"></div>
<dialog id="dlg">
  <form id="f">
    <h2 id="dt">Agregar anime</h2>
    <label>Título<input id="t" required></label>
    <div class="two">
      <label>Género<input id="g" list="gl" required></label>
      <label>Estado<select id="s"><option>Visto</option><option>Viendo</option><option>Pendiente</option></select></label>
    </div>
    <div class="two">
      <label>Episodios<input id="e" type="number" min="0" step="1"></label>
      <label>Puntaje (0 a 10)<input id="p" type="number" min="0" max="10" step="0.5"></label>
    </div>
    <label>Link de la portada<input id="u" type="url" placeholder="https://..."></label>
    <label>Link para verlo (opcional)<input id="v" type="url" placeholder="https://..."></label>
    <label>Episodio actual (si lo estás viendo)<input id="pr" type="number" min="0" step="1"></label>
    <button type="button" id="mcb">Cambiar coincidencia</button>
    <div id="mc" class="mcl"></div>
    <datalist id="gl"></datalist>
    <div class="acts">
      <button type="button" class="d" id="del">Eliminar</button>
      <button type="button" id="cx">Cancelar</button>
      <button type="submit" class="p">Guardar</button>
    </div>
  </form>
</dialog>


<dialog id="sdlg">
  <h2>Buscar anime</h2>
  <form id="sf">
    <div class="sr">
      <input id="st" placeholder="Escribe un título (opcional)" aria-label="Título a buscar">
      <button type="submit" class="p">Buscar</button>
    </div>
    <details class="fl">
      <summary>Filtros</summary>
      <label>Género<select id="sg"></select></label>
      <label>Etiqueta<select id="stg"></select></label>
      <label>Año de estreno<input id="sy" type="number" min="1960" max="2100" placeholder="Ejemplo: 2000"></label>
      <label>Ordenar por<select id="so"><option value="POPULARITY_DESC">Más populares</option><option value="SCORE_DESC">Mejor puntuados</option><option value="START_DATE_DESC">Más recientes</option><option value="TRENDING_DESC">En tendencia</option></select></label>
      <label class="ck"><input id="sa" type="checkbox"> Incluir contenido +18</label>
      <label class="ck"><input id="sx" type="checkbox"> Solo +18</label>
    </details>
  </form>
  <p id="sm" class="sub" role="status"></p>
  <div id="rl"></div>
  <div class="acts"><button type="button" id="sx">Cerrar</button></div>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var KEY='mis-animes-v1', TKEY='mis-animes-tema';
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var a=JSON.parse(r);if(Array.isArray(a))return a}}catch(x){}
  return [];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(x){}nube()}
var items=load(), editId=null;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

var FKEY='mis-animes-respaldo',FALLBACK='https://tioanime.com/anime/{slug}';
try{var fv=localStorage.getItem(FKEY);if(fv!==null)FALLBACK=fv}catch(x){}
function seguro(u){return /^https?:\/\//i.test(u||'')?u:''}
function sitios(l){var o=[];(l||[]).forEach(function(x){if(x.type==='STREAMING'&&o.indexOf(x.site)<0)o.push(x.site)});return o}
var COL=[['crunchyroll','#f47521','#1b1209'],['netflix','#e50914','#ffffff'],['youtube','#e60000','#ffffff'],['amazon','#0a7cc2','#ffffff'],['prime','#0a7cc2','#ffffff'],['disney','#113ccf','#ffffff'],['hulu','#1ce783','#0b1a12'],['hidive','#00baff','#06202b'],['funimation','#410099','#ffffff'],['hbo','#5822b4','#ffffff'],['max','#3b2bd6','#ffffff'],['tubi','#fa382f','#ffffff'],['bilibili','#00a1d6','#ffffff'],['tioanime','#7c3aed','#ffffff'],['tiohentai','#be185d','#ffffff']];
function colorDe(x){var k=String(x).toLowerCase();for(var i=0;i<COL.length;i++){if(k.indexOf(COL[i][0])>-1)return COL[i]}return null}
function chip(x,tick,c){
  var st=c?' style="background:'+c[1]+';color:'+c[2]+';border-color:'+c[1]+'"':'';
  return {st:st,cls:c?' class="b2"':'',txt:(tick?'✓ ':'')+esc(x)};
}
function donde(a){
  if(!Array.isArray(a.w))return '';
  var w=a.w.slice().sort(function(x,y){return (y==='Crunchyroll')-(x==='Crunchyroll')});
  var cu=seguro(a.v),esCr=/crunchyroll\.com/i.test(cu);
  var out=w.slice(0,4).map(function(x){
    var h=chip(x,x==='Crunchyroll',colorDe(x));
    if(x==='Crunchyroll'&&esCr)return '<a class="b2"'+h.st+' href="'+esc(cu)+'" target="_blank" rel="noopener noreferrer" title="Abrir en Crunchyroll">'+h.txt+'</a>';
    return '<span'+h.cls+h.st+'>'+h.txt+'</span>';
  }).join('');
  if(w.length>4)out+='<span>+'+(w.length-4)+' más</span>';
  if(NOF&&(a.ad||w.indexOf('Crunchyroll')<0)){
    var nomS=a.ad?'TioHentai':'TioAnime',t=colorDe(nomS),url=a.ad?tioHentai(a):'https://tioanime.com/anime/'+slugTio(a);
    out+='<a class="b2" style="background:'+t[1]+';color:'+t[2]+';border-color:'+t[1]+'" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" title="Abrir en '+nomS+'">'+nomS+'</a>';
  }
  return '<p class="w">'+out+'</p>';
}
function slugTio(a){return String(a.r||a.t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,'').replace(/\s+/g,' ').trim().replace(/ /g,'-')}
function esAdulto(m){return !!(m&&(m.isAdult||(m.genres||[]).indexOf('Hentai')>-1))}
function tioHentai(a){return 'https://tiohentai.com/hentai/'+slugTio(a)}
function limpiar(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function destino(a){
  var u=seguro(a.v);
  if(!u&&a.ad&&NOF)u=tioHentai(a);
  if(!u&&seguro(FALLBACK)&&(NOF||!/tio(anime|hentai)\.com/i.test(FALLBACK)))u=FALLBACK.split('{titulo}').join(encodeURIComponent(a.t)).split('{romaji}').join(encodeURIComponent(limpiar(a.r||a.t))).split('{slug}').join(slugTio(a));
  return u;
}
function envolver(a,inner){
  var u=destino(a);
  return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" title="Abrir enlace para verlo">'+inner+'</a>':inner;
}
$('fbk').onclick=function(){
  var u=prompt('Pega la página a la que quieres ir cuando un anime no tenga link propio. Puedes usar {slug} (página directa en TioAnime), {romaji} o {titulo}. Ejemplo: https://www.google.com/search?q={titulo}+ver+online',FALLBACK);
  if(u===null)return;
  u=u.trim();
  if(u&&!seguro(u)){toast('El enlace tiene que empezar con http:// o https://');return}
  FALLBACK=u;try{localStorage.setItem(FKEY,u)}catch(x){}
  render();
};
var tT=null;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on')},4500)}
var DKEY='mis-animes-disc',NKEY='mis-animes-nof',DISC=false,NOF=true,matchSel=null;
try{DISC=localStorage.getItem(DKEY)==='1';var nv=localStorage.getItem(NKEY);if(nv!==null)NOF=nv==='1'}catch(x){}
function aplicarPrefs(){document.body.classList.toggle('disc',DISC);$('odisc').checked=DISC;$('onof').checked=NOF}
$('odisc').onchange=function(){DISC=this.checked;try{localStorage.setItem(DKEY,DISC?'1':'0')}catch(x){}aplicarPrefs()};
$('onof').onchange=function(){NOF=this.checked;try{localStorage.setItem(NKEY,NOF?'1':'0')}catch(x){}render()};
function genres(){
  var set={};items.forEach(function(a){set[a.g]=1});
  return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'es')});
}
function fillGenres(){
  var cur=$('fg').value, gs=genres();
  $('fg').innerHTML='<option value="">Todos los géneros</option>'+gs.map(function(g){return '<option>'+esc(g)+'</option>'}).join('');
  $('fg').value=gs.indexOf(cur)>-1?cur:'';
  $('gl').innerHTML=gs.map(function(g){return '<option value="'+esc(g)+'">'}).join('');
}
function estadisticas(){
  var v=0,vi=0,pe=0,sum=0,n=0,eps=0;
  items.forEach(function(a){
    if(a.s==='Visto'){v++;eps+=parseInt(a.e,10)||0}else if(a.s==='Viendo')vi++;else pe++;
    var p=parseFloat(a.p);if(!isNaN(p)){sum+=p;n++}
  });
  $('stats').textContent=v+' vistos · '+vi+' viendo · '+pe+' pendientes'+(n?' · promedio '+(sum/n).toFixed(1):'')+(eps?' · unas '+Math.round(eps*24/60)+' h vistas':'');
}
function render(){
  var q=$('q').value.trim().toLowerCase(), fg=$('fg').value, fs=$('fs').value, od=$('ord').value;
  var list=items.filter(function(a){return (!q||a.t.toLowerCase().indexOf(q)>-1)&&(!fg||a.g===fg)&&(!fs||a.s===fs)});
  if(od==='p')list=list.slice().sort(function(a,b){var x=parseFloat(a.p),y=parseFloat(b.p);return (isNaN(y)?-1:y)-(isNaN(x)?-1:x)});
  if(od==='t')list=list.slice().sort(function(a,b){return a.t.localeCompare(b.t,'es')});
  $('cnt').textContent=list.length+' de '+items.length+' animes';
  estadisticas();
  $('grid').innerHTML=list.length?list.map(function(a){
    var img=a.u?'<img src="'+esc(a.u)+'" alt="Portada de '+esc(a.t)+'" loading="lazy" referrerpolicy="no-referrer">':esc(a.t);
    var meta=esc(a.g)+(a.e!==''&&a.e!=null?' · '+esc(a.e)+' episodios':'');
    if(a.s==='Viendo'&&a.pr!==''&&a.pr!=null)meta+=' · ep. '+esc(a.pr)+(a.e?'/'+esc(a.e):'');
    var sc=(a.p!==''&&a.p!=null)?'<span class="sc">★ '+esc(a.p)+'/10</span>':'<span class="sc n">Sin puntaje</span>';
    return '<article class="c"><div class="cv'+(a.ad?' ad':'')+'">'+envolver(a,img)+'</div><div class="b">'+donde(a)+'<h3>'+esc(a.t)+'</h3><p class="m">'+meta+'</p><div class="row"><span class="st '+esc(a.s)+'">'+esc(a.s)+'</span>'+sc+'</div><button type="button" data-id="'+esc(a.id)+'">Editar</button></div></article>';
  }).join(''):'<p class="empty">No hay animes con esos filtros. Cambia la búsqueda o agrega uno nuevo.</p>';
  Array.prototype.forEach.call(document.querySelectorAll('.cv img'),function(im){
    im.onerror=function(){var d=im.parentNode;d.textContent=im.alt.replace('Portada de ','')};
  });
}
function openDlg(id){
  editId=id;
  var a=items.filter(function(x){return x.id===id})[0]||{t:'',g:'',s:'Pendiente',e:'',p:'',u:''};
  $('dt').textContent=id?'Editar anime':'Agregar anime';
  $('t').value=a.t;$('g').value=a.g;$('s').value=a.s;$('e').value=a.e;$('p').value=a.p;$('u').value=a.u;$('v').value=a.v||'';$('pr').value=a.pr==null?'':a.pr;matchSel=null;$('mc').innerHTML='';
  $('del').style.display=id?'':'none';
  $('dlg').showModal();$('t').focus();
}
$('add').onclick=function(){openDlg(null)};
$('cx').onclick=function(){$('dlg').close()};
$('grid').onclick=function(ev){var b=ev.target.closest('button[data-id]');if(b)openDlg(b.getAttribute('data-id'))};
$('f').onsubmit=function(ev){
  ev.preventDefault();
  var o={t:$('t').value.trim(),g:$('g').value.trim(),s:$('s').value,e:$('e').value,p:$('p').value,u:$('u').value.trim(),v:$('v').value.trim(),pr:$('pr').value};
  if(matchSel){o.r=matchSel.r;o.w=matchSel.w;o.ad=matchSel.ad;matchSel=null}
  if(editId){items=items.map(function(a){return a.id===editId?Object.assign({},a,o):a})}
  else{o.id='n'+Date.now();if(!o.v)delete o.v;items.unshift(o)}
  save();fillGenres();render();$('dlg').close();
};
$('del').onclick=function(){
  if(confirm('¿Eliminar este anime de la lista?')){items=items.filter(function(a){return a.id!==editId});save();fillGenres();render();$('dlg').close()}
};
['q','fg','fs','ord'].forEach(function(id){$(id).oninput=render});

function setTheme(t){
  document.documentElement.setAttribute('data-t',t);
  $('theme').textContent=t==='dark'?'Modo claro':'Modo oscuro';
  try{localStorage.setItem(TKEY,t)}catch(x){}
}
$('theme').onclick=function(){setTheme(document.documentElement.getAttribute('data-t')==='dark'?'light':'dark')};
(function(){
  var t=null;try{t=localStorage.getItem(TKEY)}catch(x){}
  if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  setTheme(t);
})();

$('exp').onclick=function(){
  var blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-animes.json';a.click();try{localStorage.setItem('mis-animes-resp',String(Date.now()))}catch(x){}
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
};
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var a=JSON.parse(r.result);
      if(!Array.isArray(a)||a.some(function(x){return !x||!x.t}))throw 0;
      var imp=a.map(function(x,i){return {id:x.id||('i'+i+Date.now()),t:String(x.t),g:x.g||'Sin género',s:x.s||'Pendiente',e:x.e==null?'':x.e,p:x.p==null?'':x.p,u:x.u||'',v:x.v,r:x.r,w:x.w,ad:x.ad,pr:x.pr}});
      items=mezclar(items,imp);save();fillGenres();render();
    }catch(x){toast('No pude leer ese archivo. Usa uno exportado desde esta página.')}
  };
  r.readAsText(f);this.value='';
};

var busy=false;
function pausa(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function buscarUno(a){
  var base=a.t.replace(/\(.*?\)/g,'').trim();
  var c=[base];
  if(base.indexOf(':')>-1){base.split(':').forEach(function(p){p=p.trim();if(p&&c.indexOf(p)<0)c.push(p)})}
  var query='query($s:String){Media(search:$s,type:ANIME){coverImage{large}episodes title{romaji} isAdult genres externalLinks{site url type}}}';
  for(var i=0;i<c.length;i++){
    for(var n=0;n<3;n++){
      var r=await fetch('https://graphql.anilist.co',{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({query:query,variables:{s:c[i]}})
      });
      if(r.status===429){await pausa(3000);continue}
      var j=await r.json();
      var m=j&&j.data&&j.data.Media;
      if(m){var cr=(m.externalLinks||[]).filter(function(l){return l.site==='Crunchyroll'})[0];return {img:m.coverImage&&m.coverImage.large,eps:m.episodes,v:cr?cr.url:'',r:m.title&&m.title.romaji||'',w:sitios(m.externalLinks),ad:esAdulto(m)}}
      break;
    }
    await pausa(1500);
  }
  return null;
}
function vivo(a){var k=String(a.t).toLowerCase();return items.filter(function(x){return String(x.t).toLowerCase()===k})[0]||a}
function sinChequear(){return items.some(function(a){return a.v===undefined||a.r===undefined||a.w===undefined||a.ad===undefined})}
async function buscarPortadas(){
  if(busy)return;
  var falta=items.filter(function(a){return !a.u||a.e===''||a.v===undefined||a.r===undefined||a.w===undefined||a.ad===undefined});
  if(!falta.length){$('msg').textContent='Todos los animes ya tienen portada y episodios.';return}
  busy=true;$('cov').disabled=true;
  var ok=0,fallo=false;
  try{
    for(var i=0;i<falta.length;i++){
      $('msg').textContent='Buscando '+(i+1)+' de '+falta.length+': '+falta[i].t;
      var d,intentos=0;
      while(true){
        try{d=await buscarUno(falta[i]);break}
        catch(e){
          intentos++;
          if(intentos>=3)throw e;
          for(var seg=65;seg>0;seg--){$('msg').textContent='La base de datos pidió ir más lento. Reanudo en '+seg+' s...';await pausa(1000)}
        }
      }
      var it=vivo(falta[i]);
      if(d){
        if(!it.u&&d.img)it.u=d.img;
        if(it.e===''&&d.eps)it.e=d.eps;
        if(it.v===undefined)it.v=d.v||'';
        if(it.r===undefined)it.r=d.r||'';
        if(it.w===undefined)it.w=d.w||[];
        if(it.ad===undefined)it.ad=!!d.ad;
        ok++;
      }else{
        if(it.v===undefined)it.v='';
        if(it.r===undefined)it.r='';
        if(it.w===undefined)it.w=[];
        if(it.ad===undefined)it.ad=false;
      }
      save();render();
      await pausa(2200);
    }
    $('msg').textContent='Listo: encontré datos para '+ok+' de '+falta.length+'. Si alguna portada quedó mal, corrígela con Editar.';
  }catch(x){fallo=true;$('msg').textContent='La base de datos sigue sin responder. Lo que ya encontré quedó guardado. Espera unos minutos y toca Buscar portadas para seguir.'}
  busy=false;$('cov').disabled=false;
  if(!fallo&&sinChequear())buscarPortadas();
}

var rcache=[];
async function anilist(q,vars){
  for(var n=0;n<3;n++){
    var r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query:q,variables:vars})});
    if(r.status===429){await pausa(3000);continue}
    return await r.json();
  }
  return null;
}
var GEN_ES={'Action':'Acción','Adventure':'Aventura','Comedy':'Comedia','Drama':'Drama','Ecchi':'Ecchi','Fantasy':'Fantasía','Horror':'Terror','Mahou Shoujo':'Chicas mágicas','Mecha':'Mecha','Music':'Música','Mystery':'Misterio','Psychological':'Psicológico','Romance':'Romance','Sci-Fi':'Ciencia ficción','Slice of Life':'Recuentos de la vida','Sports':'Deportes','Supernatural':'Sobrenatural','Thriller':'Suspenso','Hentai':'Hentai (+18)'};
var TAG_ES={'Isekai':'Isekai','Reincarnation':'Reencarnación','Harem':'Harem','Magic':'Magia','School':'Escolar','Military':'Militar','Virtual World':'Mundo virtual','Villainess':'Villana','Super Power':'Superpoderes','Martial Arts':'Artes marciales','Demons':'Demonios','Vampire':'Vampiros','Samurai':'Samuráis','Time Manipulation':'Manipulación del tiempo','Post-Apocalyptic':'Postapocalíptico','Survival':'Supervivencia','Video Games':'Videojuegos','Cooking':'Cocina','Swordplay':'Espadas','Gore':'Gore'};
function llenarSel(id,lista,mapa,vacio){
  var o='<option value="">'+vacio+'</option>';
  lista.forEach(function(n){o+='<option value="'+esc(n)+'">'+esc(mapa[n]||n)+'</option>'});
  $(id).innerHTML=o;
}
llenarSel('sg',Object.keys(GEN_ES),GEN_ES,'Cualquier género');
llenarSel('stg',Object.keys(TAG_ES),TAG_ES,'Cualquier etiqueta (isekai, harem...)');
var cargoCat=false;
async function cargarCategorias(){
  if(cargoCat)return;
  cargoCat=true;
  try{
    var j=await anilist('query{GenreCollection MediaTagCollection{name isAdult}}',{});
    var gs=j&&j.data&&j.data.GenreCollection,tg=j&&j.data&&j.data.MediaTagCollection;
    if(gs&&gs.length){var vg=$('sg').value;llenarSel('sg',gs,GEN_ES,'Cualquier género');$('sg').value=vg}
    if(tg&&tg.length){
      var vt=$('stg').value;
      var nombres=tg.filter(function(x){return !x.isAdult}).map(function(x){return x.name}).sort(function(a,b){return (TAG_ES[a]||a).localeCompare(TAG_ES[b]||b,'es')});
      llenarSel('stg',nombres,TAG_ES,'Cualquier etiqueta (isekai, harem...)');$('stg').value=vt;
    }
  }catch(x){cargoCat=false}
}
$('sb').onclick=function(){$('sdlg').showModal();$('st').focus();cargarCategorias()};
$('sx').onchange=function(){$('sa').checked=this.checked;$('sa').disabled=this.checked};
$('sx').onclick=function(){$('sdlg').close()};
$('sf').onsubmit=async function(ev){
  ev.preventDefault();
  var t=$('st').value.trim(),y=parseInt($('sy').value,10),g=$('sg').value,tg=$('stg').value,adu=$('sa').checked||g==='Hentai';
  if(!t&&!y&&!g&&!tg){$('sm').textContent='Escribe un título o elige algún filtro.';return}
  $('sm').textContent='Buscando...';$('rl').innerHTML='';
  var dd=['$o:[MediaSort]'],ar=['type:ANIME','sort:$o'],vars={o:[$('so').value]};
  if(t){dd.push('$s:String');ar.push('search:$s');vars.s=t}
  if(y){dd.push('$a:FuzzyDateInt','$b:FuzzyDateInt');ar.push('startDate_greater:$a','startDate_lesser:$b');vars.a=y*10000;vars.b=y*10000+1232}
  if(g){dd.push('$g:[String]');ar.push('genre_in:$g');vars.g=[g]}
  if(tg){dd.push('$tg:[String]');ar.push('tag_in:$tg');vars.tg=[tg]}
  if($('sx').checked)ar.push('isAdult:true');else if(!adu)ar.push('isAdult:false');
  var q='query('+dd.join(',')+'){Page(perPage:12){media('+ar.join(',')+'){title{romaji english}seasonYear startDate{year}episodes format coverImage{large}genres isAdult externalLinks{site url type}}}}';
  try{
    var j=await anilist(q,vars);
    var m=j&&j.data&&j.data.Page&&j.data.Page.media||[];
    rcache=m;
    if(!m.length){$('sm').textContent='No encontré resultados. Prueba con otro título o quita el año.';return}
    $('sm').textContent=m.length+' resultados';
    $('rl').innerHTML=m.map(function(a,i){
      var nom=a.title.english||a.title.romaji;
      var ano=a.startDate&&a.startDate.year||'';
      var ya=items.some(function(x){return x.t.toLowerCase()===nom.toLowerCase()});
      var img=a.coverImage&&a.coverImage.large?'<img src="'+esc(a.coverImage.large)+'" alt="">':'<div class="ph"></div>';
      return '<div class="rs">'+img+'<div class="i"><b>'+esc(nom)+'</b><span>'+(a.title.romaji&&a.title.romaji!==nom?esc(a.title.romaji)+' · ':'')+esc(ano)+(a.episodes?' · '+a.episodes+' episodios':'')+(a.format?' · '+esc(a.format):'')+'</span></div>'+(ya?'<span class="m">Ya está</span>':'<button type="button" data-r="'+i+'">Agregar</button>')+'</div>';
    }).join('');
  }catch(x){$('sm').textContent='No pude conectarme a la base de datos. Revisa tu internet e intenta de nuevo.'}
};
$('rl').onclick=function(ev){
  var b=ev.target.closest('button[data-r]');if(!b)return;
  var a=rcache[+b.getAttribute('data-r')];if(!a)return;
  var nom=a.title.english||a.title.romaji;
  var g=(a.genres&&a.genres[0])||'Sin género';
  var tr={'Action':'Acción','Adventure':'Aventura','Comedy':'Comedia','Drama':'Drama','Fantasy':'Fantasía','Horror':'Terror','Romance':'Romance','Sci-Fi':'Ciencia ficción','Slice of Life':'Slice of life','Mystery':'Misterio','Sports':'Deportes','Supernatural':'Sobrenatural','Psychological':'Psicológico','Mecha':'Mecha','Music':'Música'};
  g=tr[g]||g;
  var cr=(a.externalLinks||[]).filter(function(l){return l.site==='Crunchyroll'})[0];
  items.unshift({id:'n'+Date.now(),t:nom,g:g,s:'Pendiente',e:a.episodes||'',p:'',u:(a.coverImage&&a.coverImage.large)||'',v:cr?cr.url:'',r:(a.title&&a.title.romaji)||'',w:sitios(a.externalLinks),ad:esAdulto(a)});
  save();fillGenres();render();
  b.outerHTML='<span class="m">Agregado</span>';
};

var FRAG='title{romaji english}startDate{year}episodes format coverImage{large}genres isAdult externalLinks{site url type}',mcache=[];

$('mc').onclick=function(ev){

  matchSel={u:(m.coverImage&&m.coverImage.large)||'',e:m.episodes||'',v:cr?cr.url:'',r:m.title.romaji||'',w:sitios(m.externalLinks),ad:esAdulto(m)};
  $('u').value=matchSel.u;$('e').value=matchSel.e;$('v').value=matchSel.v;

$('cov').onclick=buscarPortadas;


function mezclar(a,b){
  var m={},out=[];
  a.concat(b).forEach(function(x){
    var k=String(x.t).toLowerCase();
    if(!m[k]){m[k]=Object.assign({},x);out.push(m[k])}
    else{var y=m[k];['g','s','e','p','u','v','r','w','ad','pr'].forEach(function(f){if((y[f]===''||y[f]==null)&&x[f]!==''&&x[f]!=null)y[f]=x[f]})}
  });
  return out;
}

var usuario=null,db=null,tNube=null,unsub=null;
function nube(){
  if(!usuario||!db)return;
  clearTimeout(tNube);
  tNube=setTimeout(function(){
    db.collection('listas').doc(usuario.uid).set({data:JSON.stringify(items),actualizado:Date.now()})
      .catch(function(){$('msg').textContent='No pude guardar en la nube. Tus cambios siguen en este navegador.'});
  },700);
}
function pintarLogin(){
  $('login').textContent=usuario?'Cerrar sesión ('+(usuario.displayName||usuario.email||'Google')+')':'Iniciar sesión con Google';
}
if(FB_CONFIG.apiKey&&window.firebase){
  firebase.initializeApp(FB_CONFIG);
  db=firebase.firestore();
  var auth=firebase.auth();
  $('login').onclick=function(){
    if(usuario){
      if(unsub){unsub();unsub=null}
      auth.signOut().then(function(){usuario=null;items=[];save();fillGenres();render();pintarLogin();$('msg').textContent='Sesión cerrada.'});
      return;
    }
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){$('msg').textContent='No pude iniciar sesión ('+(e.code||'error')+').'});
  };
  auth.onAuthStateChanged(function(u){
    usuario=u;pintarLogin();
    if(!u)return;
    $('msg').textContent='Cargando tu lista...';
    var primera=true;
    if(unsub)unsub();
    unsub=db.collection('listas').doc(u.uid).onSnapshot(function(d){
      if(d.metadata.hasPendingWrites)return;
      var remota=[];
      if(d.exists){try{remota=JSON.parse(d.data().data)||[]}catch(x){}}
      if(primera){
        primera=false;
        items=mezclar(remota,items);
        save();fillGenres();render();
        $('msg').textContent='Lista cargada desde tu cuenta.';
        if(items.some(function(a){return !a.u||a.v===undefined||a.r===undefined||a.w===undefined||a.ad===undefined}))buscarPortadas();
      }else if(d.exists&&d.data().data!==JSON.stringify(items)){
        items=remota;
        try{localStorage.setItem(KEY,JSON.stringify(items))}catch(x){}
        fillGenres();render();
        $('msg').textContent='Se actualizó desde otro dispositivo.';
      }
    },function(){$('msg').textContent='No pude leer tu lista de la nube. Revisa las reglas de Firestore.'});
  });
}else{
  $('login').onclick=function(){
    toast(window.firebase?'Falta pegar la configuración de Firebase en el archivo (FB_CONFIG).':'No pude cargar Firebase. Revisa tu internet.');
  };
}

aplicarPrefs();
setTimeout(function(){
  if(usuario||!items.length)return;
  var u=0;try{u=parseInt(localStorage.getItem('mis-animes-resp'),10)||0}catch(x){}
  if(Date.now()-u>14*864e5)toast('Hace tiempo que no exportas un respaldo. Usa Exportar para guardar tu lista.');
},5000);

if(items.some(function(a){return !a.u||a.v===undefined||a.r===undefined||a.w===undefined||a.ad===undefined}))buscarPortadas();
</script>
